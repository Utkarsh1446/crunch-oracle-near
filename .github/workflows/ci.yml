name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: contract tests
        run: cargo test --manifest-path contract/Cargo.toml
      - name: wasm build
        run: cargo build --manifest-path contract/Cargo.toml --release --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: oracle tests
        run: python3 -m unittest oracle.test_oracle
      - name: dashboard build
        run: python3 scripts/build_dashboard.py
      - name: recompute Brier from the stored snapshot
        run: python3 scripts/verify_onchain.py --snapshot dashboard/snapshot.json
